name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The suite exercises the HNSW index, chunker, and store against synthetic
      # vectors, so it needs numpy but not the (heavy) sentence-transformers model.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy "pytest>=8.0"

      - name: Run tests
        run: pytest -q
